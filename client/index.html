    <script type="module">
      if ('serviceWorker' in navigator) {
        if (import.meta.env.DEV) {
          // A PWA service worker must not cache Vite's development HTML or modules.
          // Remove registrations left by an earlier development session.
          navigator.serviceWorker.getRegistrations().then(registrations => {
            return Promise.all(registrations.map(registration => registration.unregister()));
          }).then(() => caches.keys()).then(cacheNames => {
            return Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
          });
        } else {
          let hadController = Boolean(navigator.serviceWorker.controller);
          let reloadingForUpdate = false;

          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (hadController && !reloadingForUpdate) {
              reloadingForUpdate = true;
              window.location.reload();
            }
            hadController = true;
          });

          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(registration => {
              const activateUpdate = () => {
                registration.waiting?.postMessage({ type: 'SKIP_WAITING' });
              };

              if (registration.waiting) {
                activateUpdate();
              }

              registration.addEventListener('updatefound', () => {
                const installing = registration.installing;
                if (!installing) return;

                installing.addEventListener('statechange', () => {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    activateUpdate();
                  }
                });
              });

              // Check immediately on every app launch instead of waiting for
              // the browser's periodic service-worker update interval.
              return registration.update();
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        }
      }
    </script>
